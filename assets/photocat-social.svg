<?xml version="1.0" encoding="UTF-8"?>
<!--
  photocat — the social preview: the lockup on a 1280x640 plate.

  GitHub, Telegram, Slack, Discord, Reddit and X show this file as the card of a link, so it is
  drawn at the size those cards want (1280 by 640) and never scaled by a renderer.

  The drawing is `photocat-lockup.svg` verbatim — the same <defs>, the mark and the word, with the
  same transforms — wrapped in one group that maps its 800 by 220 viewBox onto 960 by 264 of this
  plate, centred: 160 px of air left and right, 188 above and below. The lockup's own band (800 by
  220 at 76.7, 196.15) paints the middle of the plate in the same colour as the card, so the seam is
  invisible. The colours stay CSS variables, as in both other sources.

  A change to the mark or the word is made in `photocat-lockup.svg` and copied here; `render.sh`
  renders both.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     fill="none" role="img" aria-label="photocat">
  <title>photocat — a photocatalog for a family archive</title>
  <style>
    :root { --photocat-mark: #f59e0b; --photocat-word: #e7e8ee; --photocat-band: #222327; }
    @media (prefers-color-scheme: light) {
      :root { --photocat-mark: #b45309; --photocat-word: #0f172a; --photocat-band: #f1f5f9; }
    }
  </style>

  <!-- The plate: the whole card, in the colour of the band the lockup sits on. -->
  <rect id="card" x="0" y="0" width="1280" height="640" fill="var(--photocat-band, #222327)"/>

  <!-- The lockup: 800 by 220 mapped onto 960 by 264, centred on the plate. -->
  <g id="lockup" transform="translate(67.96,-47.38) scale(1.2)">
  <defs>
    <!-- Black is a hole: the frame's inner field and the lens. The fills are explicit, because the
         root says fill="none" and that is inherited. -->
