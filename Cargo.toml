[package]
name = "photocat"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A local-first photocatalog for a family media archive: indexing, duplicates, CLIP search, OCR, faces. Originals untouched."
repository = "https://github.com/ruchej-dev/photocat"
homepage = "https://ruchej-dev.github.io/photocat/"
keywords = ["photocatalog", "photo", "deduplication", "ocr", "clip"]
categories = ["multimedia::images"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
cpal = "0.18.2"
eframe = "0.37.0"
egui = "0.37.0"
image = { version = "0.25.10", features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
image_hasher = "3.1.1"
kamadak-exif = "0.6.2"
ort = "2.0.0-rc.15"
rayon = "1.12.0"
rff-codec = "0.8"
rff-codec-aac = "1.1"
rff-codec-h264 = { version = "0.3", features = ["asm"] }
rff-codec-hevc = "0.2"
rff-codec-jpeg = "0.8"
rff-codec-pcm = "0.8"
rff-core = "0.8"
rff-format = "0.8"
rff-format-mkv = "0.8"
rff-format-mp4 = "0.8"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["progressbar", "onig"] }
trash = "5.4.0"
ureq = "3.5.2"
walkdir = "2.5.1"

[target.'cfg(target_os = "linux")'.dependencies]
turbojpeg = { version = "1.5.1", default-features = false, features = ["pkg-config"] }

# `cargo run` — это debug-сборка, а декодер в ней в 19 раз медленнее: видео
# превращалось в слайд-шоу (2.2 к/с против 41.9). Зависимости собираем как в
# релизе, свой код — с лёгкой оптимизацией: отладка остаётся, видео играет.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
